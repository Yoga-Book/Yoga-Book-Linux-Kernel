name: Build Yoga Book kernel

on:
  push:
    branches:
      - build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yogabook-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debian kernel packages
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out build branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison build-essential ccache cpio debhelper dwarves fakeroot flex \
            kmod libdw-dev libelf-dev libssl-dev python3 rsync zstd

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.52.0

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-yogabook-kernel-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-yogabook-kernel-

      - name: Configure compiler cache
        run: |
          ccache --max-size=3G
          ccache --zero-stats

      - name: Build kernel image and headers packages
        env:
          DEB_BUILD_PROFILES: pkg.linux-upstream.nokerneldbg
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github
        run: task build JOBS="$(nproc)"

      - name: Collect installable packages
        run: |
          mkdir -p artifacts
          find .. -maxdepth 1 -type f \
            \( -name 'linux-image-*yogabook*.deb' -o -name 'linux-headers-*yogabook*.deb' \) \
            -exec cp --target-directory=artifacts {} +
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.deb' -print -quit)"
          sha256sum artifacts/*.deb > artifacts/SHA256SUMS

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: yogabook-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
